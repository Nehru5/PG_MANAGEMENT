<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Profile</title>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }


    /* ==============================
       BODY
    ============================== */

    body {

      min-height: 100vh;

      color: white;

      background:
        radial-gradient(
          circle at 50% -20%,
          rgba(229, 9, 20, 0.20),
          transparent 40%
        ),
        radial-gradient(
          circle at 100% 100%,
          rgba(229, 9, 20, 0.08),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #050505,
          #0b0b0b,
          #141414
        );

      overflow-x: hidden;
    }


    /* ==============================
       NAVBAR
    ============================== */

    .navbar {

      height: 75px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 5%;

      background: rgba(0, 0, 0, 0.75);

      border-bottom: 1px solid rgba(255, 255, 255, 0.08);

      backdrop-filter: blur(15px);

      -webkit-backdrop-filter: blur(15px);

      position: sticky;

      top: 0;

      z-index: 100;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.5);
    }


    /* ==============================
       NAVBAR LINKS
    ============================== */

    .navbar a {

      color: #b3b3b3;

      text-decoration: none;

      transition: 0.3s ease;
    }


    .navbar a:hover {

      color: white;
    }


    .left a,
    .right a {

      padding: 10px 16px;

      border-radius: 5px;

      font-size: 14px;

      font-weight: 600;

      transition: 0.3s ease;
    }


    .left a:hover,
    .right a:hover {

      background: rgba(229, 9, 20, 0.12);

      color: white;

      transform: translateY(-2px);
    }


    /* ==============================
       PAGE
    ============================== */

    .page {

      min-height: calc(100vh - 75px);

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 50px 20px;

      position: relative;
    }


    /* ==============================
       BACKGROUND GLOW
    ============================== */

    .page::before {

      content: "";

      position: absolute;

      width: 500px;

      height: 500px;

      border-radius: 50%;

      background: rgba(229, 9, 20, 0.07);

      filter: blur(100px);

      top: 50%;

      left: 50%;

      transform: translate(-50%, -50%);

      animation: glow 5s ease-in-out infinite alternate;
    }


    @keyframes glow {

      from {
        transform: translate(-50%, -50%) scale(1);
      }

      to {
        transform: translate(-50%, -50%) scale(1.2);
      }

    }


    /* ==============================
       PROFILE CARD
    ============================== */

    .profile-card {

      width: 700px;

      max-width: 95%;

      position: relative;

      z-index: 2;

      padding: 45px;

      background: rgba(20, 20, 20, 0.72);

      border: 1px solid rgba(255, 255, 255, 0.10);

      border-radius: 12px;

      backdrop-filter: blur(20px);

      -webkit-backdrop-filter: blur(20px);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.8),
        0 0 40px rgba(229, 9, 20, 0.08);

      animation: cardEntry 0.8s ease;

      transition: 0.4s ease;
    }


    .profile-card:hover {

      transform: translateY(-7px);

      box-shadow:
        0 40px 100px rgba(0, 0, 0, 0.9),
        0 0 45px rgba(229, 9, 20, 0.12);
    }


    @keyframes cardEntry {

      from {

        opacity: 0;

        transform:
          translateY(40px)
          scale(0.96);
      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }


    /* ==============================
       PROFILE HEADER
    ============================== */

    .profile-header {

      display: flex;

      align-items: center;

      gap: 45px;

      padding-bottom: 35px;

      border-bottom: 1px solid #2a2a2a;
    }


    /* ==============================
       PROFILE IMAGE
    ============================== */

    .profile-image {

      width: 170px;

      height: 170px;

      min-width: 170px;

      border-radius: 50%;

      padding: 4px;

      background: linear-gradient(
        135deg,
        #e50914,
        #7f0000,
        #e50914
      );

      box-shadow:
        0 0 30px rgba(229, 9, 20, 0.20);

      transition: 0.4s ease;

      animation: imageAppear 0.8s ease;
    }


    .profile-image:hover {

      transform: scale(1.05) rotate(2deg);

      box-shadow:
        0 0 40px rgba(229, 9, 20, 0.40);
    }


    .profile-image img {

      width: 100%;

      height: 100%;

      object-fit: cover;

      border-radius: 50%;

      display: block;

      border: 4px solid #111;
    }


    @keyframes imageAppear {

      from {

        opacity: 0;

        transform: scale(0.7);
      }

      to {

        opacity: 1;

        transform: scale(1);
      }

    }


    /* ==============================
       PROFILE INFO
    ============================== */

    .profile-info {

      flex: 1;
    }


    .profile-info h1 {

      font-size: 30px;

      margin-bottom: 8px;

      color: white;

      word-break: break-word;
    }


    .username {

      color: #e50914;

      font-size: 15px;

      font-weight: bold;

      margin-bottom: 20px;
    }


    .bio {

      color: #aaa;

      font-size: 14px;

      line-height: 1.6;

      margin-bottom: 20px;
    }


    /* ==============================
       DETAILS
    ============================== */

    .details {

      display: flex;

      flex-direction: column;

      gap: 12px;
    }


    .detail {

      display: flex;

      align-items: center;

      gap: 12px;

      color: #ccc;

      font-size: 14px;

      padding: 10px 12px;

      background: rgba(255, 255, 255, 0.03);

      border-radius: 5px;

      transition: 0.3s ease;
    }


    .detail:hover {

      background: rgba(229, 9, 20, 0.08);

      transform: translateX(5px);

      color: white;
    }


    .detail-icon {

      width: 30px;

      height: 30px;

      display: flex;

      justify-content: center;

      align-items: center;

      border-radius: 50%;

      background: rgba(229, 9, 20, 0.12);

      color: #e50914;
    }


    /* ==============================
       PROFILE BOTTOM
    ============================== */

    .profile-bottom {

      padding-top: 30px;

      text-align: center;
    }


    .profile-title {

      font-size: 13px;

      color: #777;

      text-transform: uppercase;

      letter-spacing: 2px;

      margin-bottom: 12px;
    }


    .red-line {

      width: 50px;

      height: 3px;

      background: #e50914;

      margin: auto;

      border-radius: 10px;

      box-shadow:
        0 0 15px rgba(229, 9, 20, 0.5);

      animation: lineAnimation 2s ease-in-out infinite alternate;
    }


    @keyframes lineAnimation {

      from {
        width: 35px;
      }

      to {
        width: 70px;
      }

    }


    /* ==============================
       UPDATE BUTTON
    ============================== */

    .update-button {

      display: inline-block;

      margin-top: 25px;

      padding: 12px 28px;

      background: #e50914;

      color: white;

      text-decoration: none;

      border-radius: 5px;

      font-size: 14px;

      font-weight: bold;

      transition: 0.3s ease;

      box-shadow:
        0 8px 20px rgba(229, 9, 20, 0.20);
    }


    .update-button:hover {

      background: #f6121d;

      transform: translateY(-3px);

      box-shadow:
        0 12px 30px rgba(229, 9, 20, 0.35);
    }


    /* ==============================
       RESPONSIVE
    ============================== */

    @media (max-width: 700px) {

      .navbar {

        padding: 0 20px;
      }


      .left a,
      .right a {

        font-size: 12px;

        padding: 8px;
      }


      .profile-card {

        padding: 30px 25px;
      }


      .profile-header {

        flex-direction: column;

        text-align: center;

        gap: 25px;
      }


      .profile-info {

        width: 100%;
      }


      .details {

        text-align: left;
      }

    }


    @media (max-width: 450px) {

      .navbar {

        height: auto;

        min-height: 75px;

        padding: 15px;

      }


      .profile-image {

        width: 135px;

        height: 135px;

        min-width: 135px;
      }


      .profile-info h1 {

        font-size: 24px;
      }


      .profile-card {

        padding: 25px 18px;
      }


      .detail {

        font-size: 12px;
      }

    }

  </style>

</head>


<body>


  <!-- ==============================
       NAVBAR
  ============================== -->

  <div class="navbar">


    <div class="left">

      <a href="{% url 'admin_dashboard_link' %}">
        ← Back to Dashboard
      </a>

    </div>


    <div class="right">

      <a href="{% url 'admin_profile_update_link' %}">
        Update Profile
      </a>

    </div>


  </div>



  <!-- ==============================
       PROFILE
  ============================== -->

  <div class="page">


    <div class="profile-card">


      <div class="profile-header">


        <!-- Profile Image -->

        <div class="profile-image">

          <img
            src="{{admin.admin_pic.url}}"
            alt="{{admin.username}}"
          >

        </div>



        <!-- Profile Information -->

        <div class="profile-info">


          <h1>
            {{admin.username}}
          </h1>


          <div class="username">
            PG ADMIN
          </div>


          <p class="bio">

            Manage your PG operations, rooms and
            resident information from your dashboard.

          </p>


          <div class="details">


            <div class="detail">

              <div class="detail-icon">
                ✉
              </div>

              <span>
                {{admin.email}}
              </span>

            </div>


            <div class="detail">

              <div class="detail-icon">
                ☎
              </div>

              <span>
                {{admin.phone}}
              </span>

            </div>


          </div>


        </div>


      </div>



      <!-- Bottom Section -->

      <div class="profile-bottom">


        <div class="profile-title">
          Administrator Profile
        </div>


        <div class="red-line"></div>


        <a
          href="{% url 'admin_profile_update_link' %}"
          class="update-button"
        >
          Update Profile
        </a>


      </div>


    </div>


  </div>


</body>

</html>
