<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      padding: 0;margin: 0;
    }
    .navbar{
      display: flex;
      align-items: center;
      justify-content: space-between;
      background:linear-gradient(to right,rgb(238, 116, 236), rgb(240, 19, 207));
      color: white;
      height: 75px;
    }
    .right{
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      width: 50%;
    }
    .container{
display: flex;
align-items: center;
justify-content: space-evenly;
margin-top: 50px;
    }

    .image{
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      flex-direction: column;
      box-shadow: 0 0 10px black;
      border-radius: 20px;
    }
    .container .image > img{
      border-radius: 20px;
    }
    button{
      width: 100%;
      height: 30px;
      margin-top: 10px;
      background-color: black;
      color: white;
      font-weight: bolder;
       border: none;
       border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="left">
      <h2>LOGO</h2>
    </div>
    <div class="right">
     <a href="{% url 'add_room_link' %}"> <h2>Add room</h2></a>
      <h2>Manage room</h2>
      <a href="{% url 'admin_profile_link' %}"><h2>Profile</h2></a>
    </div>
  </div>
  <center><h1>Welcome, {{admin_name}}</h1></center>

<div class="container">
    {% for i in rooms %}
    <div class="image">
      <h1>{{i.id}}</h1>
      <img src="{{i.room_image.url}}" height="200px" width="300px" alt="">
    <a href="{% url 'room_detail_link' i.id %}"><button>View Room</button></a>
    </div>
  {% endfor %}
</div>
</body>
</html>
