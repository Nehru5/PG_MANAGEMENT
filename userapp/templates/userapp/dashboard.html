<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      padding: 0;margin: 0;
    }
    .navbar{
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 75px;
      width: 100%;
      background-color: blueviolet;
      color:  white;
    }
    .right{
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      width: 50%;
    }
    .container{
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      margin-top: 30px;
    }
    .rooms{
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      flex-direction: column;
      box-shadow:  0 0 10px black;
      border-radius: 20px;
      padding: 10px;
    }
    .rooms button{
      height: 30px;
      background-color: blueviolet;
      color: white;
      font-weight: bolder;
      border-radius: 10px;
      border: none;
      padding: 5px;
      width: 50%;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="left">
      <h2>LOGO</h2>
    </div>
    <div class="right">
      <h2>View Fees</h2>
      <h2>View Notice</h2>
      <h2>View Food</h2>
      <h2>Profile</h2>
    </div>
  </div>

  <center><h1>Welcome, {{username}} </h1></center>

  <div class="container">
    {% for i in rooms %}
    <div class="rooms">
      <img src="{{i.room_image.url}}" height="250px" width="250px" alt="">
      <button>View Room</button>
    </div>
    {% endfor %}
  </div>
</body>
</html>
